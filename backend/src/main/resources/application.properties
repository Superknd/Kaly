spring.application.name=kaly-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kaly?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:kaly}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.error.include-message=never

kaly.storage-location=${KALY_STORAGE_DIR:./data/documents}
kaly.jwt.secret=${KALY_JWT_SECRET:}
kaly.jwt.expiration=PT12H
kaly.cors.allowed-origin=${KALY_CORS_ORIGIN:http://localhost:4200}
kaly.password-reset.enabled=${KALY_PASSWORD_RESET_ENABLED:false}
kaly.password-reset.frontend-url=${KALY_FRONTEND_URL:http://localhost:4200/}
kaly.mail.from=${KALY_MAIL_FROM:noreply@kaly.local}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
management.health.mail.enabled=${KALY_PASSWORD_RESET_ENABLED:false}

management.endpoints.web.exposure.include=health,info
