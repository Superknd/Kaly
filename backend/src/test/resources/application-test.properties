spring.datasource.url=jdbc:h2:mem:kaly;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
kaly.jwt.secret=local-test-secret-that-is-long-enough-1234567890
kaly.storage-location=${java.io.tmpdir}/kaly-test-documents
kaly.password-reset.enabled=true
kaly.password-reset.frontend-url=http://localhost:4200/
kaly.mail.from=noreply@example.test
management.health.mail.enabled=false
