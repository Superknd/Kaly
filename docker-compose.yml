services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kaly
      MYSQL_USER: kaly
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: Kaly
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:4200}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: kaly
      DB_USERNAME: kaly
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KALY_JWT_SECRET: ${KALY_JWT_SECRET:?Set KALY_JWT_SECRET in .env}
      KALY_JWT_EXPIRATION_SECONDS: ${KALY_JWT_EXPIRATION_SECONDS:-43200}
      KALY_STORAGE_DIR: /app/data/documents
      KALY_CORS_ORIGIN: ${KALY_CORS_ORIGIN:-http://localhost:4200}
      KALY_DEMO_ACCOUNTS_ENABLED: ${KALY_DEMO_ACCOUNTS_ENABLED:-false}
      KALY_DEMO_ADMIN_NAME: ${KALY_DEMO_ADMIN_NAME:-Kaly Admin}
      KALY_DEMO_ADMIN_EMAIL: ${KALY_DEMO_ADMIN_EMAIL:-admin@kaly.local}
      KALY_DEMO_ADMIN_PASSWORD: ${KALY_DEMO_ADMIN_PASSWORD:-}
      KALY_DEMO_USER_NAME: ${KALY_DEMO_USER_NAME:-Kaly User}
      KALY_DEMO_USER_EMAIL: ${KALY_DEMO_USER_EMAIL:-user@kaly.local}
      KALY_DEMO_USER_PASSWORD: ${KALY_DEMO_USER_PASSWORD:-}
      KALY_PASSWORD_RESET_ENABLED: ${KALY_PASSWORD_RESET_ENABLED:-false}
      KALY_FRONTEND_URL: ${KALY_FRONTEND_URL:-http://localhost:4200/}
      KALY_MAIL_FROM: ${KALY_MAIL_FROM:-noreply@example.com}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - document-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  mysql-data:
  document-data:
